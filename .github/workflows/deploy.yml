name: Build & Deploy Backend to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 25 (Using v5 to run on Node 24 without deprecation warnings)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Step 3: Grant Execute Permissions to Maven Wrapper
      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      # Step 4: Build Production JAR
      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      # Step 5: Transfer the Built JAR to your EC2 server
      - name: Copy JAR to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/CampusPlacmentTracker-0.0.1-SNAPSHOT.jar"
          target: "~/CampusHire-backend"

      # Step 6: Deploy & Restart Docker on AWS EC2
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CampusHire-backend
            git pull origin main
            docker compose down
            docker compose up -d --build
