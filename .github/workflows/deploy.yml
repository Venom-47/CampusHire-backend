name: Build & Deploy Backend to AWS EC2

# Trigger whenever code is pushed to 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 25 environment
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile and Package the JAR
      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      # Step 4: Deploy to AWS EC2 via SSH
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory on EC2
            cd ~/CampusHire-backend
            
            # Pull latest git changes
            git pull origin main
            
            # Rebuild and restart the Docker containers in background
            docker compose down
            docker compose up -d --build
