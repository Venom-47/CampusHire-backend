services:
  postgres:
    image: postgres:16.2
    container_name: campus_hire_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_hire}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - campus_net

  backend:
    build: .
    container_name: campus_hire_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-campus_hire}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - postgres
    networks:
      - campus_net

volumes:
  pgdata:

networks:
  campus_net:
    driver: bridge
